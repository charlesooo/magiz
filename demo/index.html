<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magiz-Infinite-city</title>
  <link rel="stylesheet" href="index.css" />
  <script src="https://cdn.bootcdn.net/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/rythm.js/2.2.5/rythm.min.js
  "></script>
</head>

<body>
  <div id="magiz"></div>
  <!-- <b id="back" class="title" style="transform: translate(12px, 12px);"> Infinite City </b> -->

  <svg id="mask" class="cyberDance" width="100%" height="100%">
    <mask id="maskEl">
      <rect x="0" y="0" width="100%" height="100%" fill="white" />
      <image href="infinite.svg" fill="black" id="t1" />
      <image href="city.svg" fill="black" id="t2" />
    </mask>
    <rect width="100%" height="100%" fill="#111" mask="url(#maskEl)" />
  </svg>

  <div id="details">
    <span></span>
    <p>参数化生成 1917 栋建筑模型， Shader 渲染边线和动画，由 Magiz 驱动</p>
  </div>

  <button id="btn" type="button" onclick="toggleScale()">全屏</button>

  <div id="cover"></div>

  <script type="module" src="index.mjs"></script>
  <script src="./animation.js"></script>
</body>

</html>
