<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Magiz | CDN + WebGL</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="magiz"></div>
  </body>

  <script type="module">
    import { Plan, styles } from '../dist/magiz.module.min.js' // npm run build
    import { THREE, init } from './webGL.mjs'
    import { showAll } from './showAll.mjs'

    const handler = init()

    if (1) {
      showAll(handler)
    } else {
      const params = { style: 'SV0', height: 50, match: 0, floorHeight: 3, elevation: 0, seed: 0 }
      const loops = [
        [
          [0, 0],
          [40, 0],
          [60, -20],
          [80, -20],
          [80, 30],
          [0, 30],
        ],
      ]

      const model = new Plan({ params, loops }).toModel(styles, {
        basicMaterial: false,
        greyScale: false,
        edge: true,
      })

      handler.scene.add(model)
    }
  </script>
</html>
