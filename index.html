<body>
  <canvas id="magiz"></canvas>
  <script type="module">
    import { styles, PLAN, STYLES, WEB3D } from './dist/magiz.min.js'
    import { requests } from './csR2.mjs'

    // 初始化场景
    const web3D = new WEB3D(document.querySelector('#magiz'))

    // // 创建建筑平面
    // const plan = new PLAN({
    //   params: {
    //     style: 'Random',
    //     height: 24,
    //     floorHeight: 3,
    //     elevation: 0,
    //     seed: 0
    //   },

    //   ]
    // })

    // // 从平面按样式库生成建筑模型数据
    // const data = plan.generate(styles)

    // // 用数据更新场景
    // web3D.refresh([data], true, true)

    const data = []
    requests.length = 100
    requests.forEach(req => {
      const [style, height, floorHeight] = req[0]
      const r = {
        params: {
          style,
          height,
          floorHeight: 3,
          elevation: 0,
          seed: 0
        },
        loops: req[1]
      }
      const plan = new PLAN(r)
      data.push(plan.generate(styles))
    });

    web3D.refresh(data, true, true)

  </script>
