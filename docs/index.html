<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Magiz Demo</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="magiz"></div>
  </body>

  <script type="module">
    // if error: npm run build
    import { Plan, styles } from '../dist/magiz.module.min.js'
    import { THREE, init, planParams, modelParams } from './webGL.mjs'
    import { showAll } from './showAll.mjs'

    const handler = init()

    if (0) {
      // to show all the styles
      showAll(handler)
    } else {
      // to generate a building
      // 1. create a plan
      const plan = new Plan(planParams)
      // 2. generate model from plan
      const model = plan.toModel(styles, modelParams)
      // 3. add model to three.js scene
      handler.scene.add(model)
    }
  </script>
</html>
